{% extends 'base.html' %}
{% block title %}Cadastro — MPD Nexus{% endblock %}
{% block content %}<section class="auth-shell"><div class="auth-card auth-card-wide"><div class="auth-head"><div><p class="eyebrow">Cadastro</p><h1>Crie sua conta</h1></div><span class="auth-icon"><i class="bi bi-person-plus"></i></span></div><div class="auth-tabs"><a href="{{ url_for('login') }}">Entrar</a><a class="active" href="{{ url_for('cadastro') }}">Cadastro</a></div><form method="post"><label class="field"><span>Nome completo *</span><input name="nome" placeholder="Digite seu nome..." required></label><label class="field"><span>E-mail *</span><input type="email" name="email" placeholder="seuemail@exemplo.com" required></label><div class="field-row"><label class="field"><span>Senha *</span><input type="password" name="senha" minlength="6" placeholder="Mínimo 6 caracteres" required></label><label class="field"><span>Tipo de conta</span><select name="tipo"><option value="cliente">Cliente</option><option value="profissional">Profissional</option></select></label></div><label class="terms"><input type="checkbox" required> <span>Concordo com o uso dos dados para demonstração acadêmica do sistema.</span></label><button class="btn btn-primary btn-block">Criar conta</button></form><p class="auth-footer">Já possui cadastro? <a href="{{ url_for('login') }}">Entrar</a></p></div></section>{% endblock %}
