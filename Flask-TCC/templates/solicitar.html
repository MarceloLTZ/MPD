{% extends 'base.html' %}{% block title %}Solicitar serviço — MPD Nexus{% endblock %}{% block content %}<section class="section-block wrap narrow"><div class="content-card"><p class="eyebrow">Nova solicitação</p><h1>Solicitar serviço</h1><div class="request-professional"><span class="avatar">{{ profissional.nome[0]|upper }}</span><span><b>{{ profissional.nome }}</b><small>{{ profissional.especialidade }} • {{ profissional.cidade }}</small></span></div><form method="post" class="form-stack"><label class="field"><span>Tipo de serviço</span><select name="servico_id"><option value="">Selecione</option>{% for s in servicos %}<option value="{{ s.id }}">{{ s.nome }}</option>{% endfor %}</select></label><label class="field"><span>Descreva o problema *</span><textarea name="descricao" rows="4" placeholder="Ex.: tomada parou de funcionar..." required></textarea></label><label class="field"><span>Endereço *</span><input name="endereco" placeholder="Rua, número e bairro" required></label><label class="field"><span>Data desejada</span><input type="date" name="data_desejada"></label><button class="btn btn-primary">Enviar solicitação</button></form></div></section>{% endblock %}
